name: ScanSocial CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine-tests:
    name: Backend Engine Tests & Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/engine/requirements.txt pytest pytest-asyncio httpx

      - name: Run Pytest Suite & 10-Criteria Benchmark
        run: |
          cd apps/engine
          python -m pytest tests/ -v

  desktop-lint:
    name: Frontend & Desktop Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd apps/desktop
          npm ci

      - name: Typecheck TypeScript
        run: |
          cd apps/desktop
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser workflow dependencies
        run: |
          python -m pip install -r apps/engine/requirements.txt
          cd apps/desktop
          npx playwright install --with-deps chromium
      - name: Real browser workflows
        working-directory: apps/desktop
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/desktop/test-results
