name: Desktop Packages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev
      - name: Install dependencies
        run: |
          python -m pip install -r apps/engine/requirements.txt pyinstaller
          npm ci --prefix apps/desktop
      - name: Backend workflows
        run: python -m pytest apps/engine/tests -q
      - name: Package engine
        run: python scripts/build-sidecar.py
      - name: Test packaged engine
        run: python scripts/smoke-sidecar.py
      - name: Build native packages
        working-directory: apps/desktop
        run: npm run tauri build
      - name: Save installers
        uses: actions/upload-artifact@v4
        with:
          name: scansocial-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/Cargo.lock
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
