[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scansocial-engine"
version = "0.1.0"
description = "ScanSocial Local Backend Sidecar Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.4",
    "keyring>=24.3.0",
    "cryptography>=42.0.0",
    "websockets>=12.0",
    "python-dateutil>=2.9.0",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
    "mypy>=1.9.0"
]
